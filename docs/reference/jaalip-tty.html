<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jaalip.com (tty1)</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="Jaakko, AI specialist and consultant in Helsinki. Self-hosted, GDPR-compliant LLM platforms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,100..800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Palette: polar night. Cold slate base, frost text, ice accent, pine for success. */
:root{
  --bg:#0F1A24; --bg-2:#152431; --fg:#CFD9E2; --dim:#6E8293; --snow:#F2F5F7;
  --ice:#7CC4F0; --pine:#7DBA94; --amber:#E5B567; --red:#E27878; --violet:#B39DDB; --teal:#6FC7C2;
  --mono:"Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The site is dark only. Tokens repeat so viewer theme switches never flip it. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1A24; --fg:#CFD9E2; } }
:root[data-theme="dark"]{ --bg:#0F1A24; --fg:#CFD9E2; }
@media (prefers-contrast: more){ :root{ --dim:#9DB0C0; --fg:#E6EDF3; } }

*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--bg);color:var(--fg);
  font-family:var(--mono);font-variation-settings:"wdth" 87.5;font-weight:400;
  font-size:clamp(.76rem,.68rem + .36vw,.93rem);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:rgba(124,196,240,.32);color:var(--snow)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%}
#term{
  height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:1.1rem clamp(.85rem,3vw,2rem) calc(6.2rem + env(safe-area-inset-bottom,0px));
  scrollbar-width:thin;scrollbar-color:#2A3D4D transparent;
}
#screen{max-width:96ch}

.ln{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.55em}
.ln.block{white-space:normal}
pre{margin:0;font:inherit;font-variation-settings:inherit}
.scroll-x{overflow-x:auto;scrollbar-width:thin}

/* Semantic colors */
.dim{color:var(--dim)} .err{color:var(--red)} .ok{color:var(--pine);font-weight:600} .okb{color:var(--fg)}
.hash{color:var(--amber)} .ref{color:var(--teal)} .ty{color:var(--violet)}
.dir{color:var(--ice);font-weight:650} .hid{color:var(--dim)} .echo{color:var(--snow)}
.pb{color:var(--dim)} .pu{color:var(--pine);font-weight:600} .ph{color:var(--ice);font-weight:600} .pd{color:var(--fg)} .pv{color:var(--amber);font-weight:700}
.tilde{color:#3B5A75} .heat{color:var(--amber)} .colon{color:var(--ice);font-weight:700}
.h1{color:var(--snow);font-weight:650}

a.lnk{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(207,217,226,.45);cursor:pointer;transition:color 120ms ease-out,border-color 120ms ease-out}
a.lnk:hover{color:var(--snow);border-bottom-color:var(--ice)}
a.lnk:active{color:var(--ice)}

.cur{display:inline-block;width:.6em;height:1.12em;background:var(--ice);vertical-align:-.22em;margin-left:1px;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Fetch card */
.fetch{display:flex;flex-wrap:wrap;gap:.6rem 3ch;margin:.35rem 0 .7rem;align-items:flex-start}
.art{line-height:1.22;color:var(--dim)}
/* JL logo: shadow-block letters, two stacked layers so glyphs align exactly */
.logo{display:flex;flex-direction:column;align-items:center;gap:.9em;padding-top:.3em}
.logo-mark{position:relative}
.logo pre{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-variation-settings:normal;font-size:1.7em;line-height:1}
.lg-block{
  background:linear-gradient(100deg,var(--ice) 0%,var(--violet) 40%,var(--snow) 50%,var(--violet) 60%,var(--ice) 100%);
  background-size:250% 100%;background-position:150% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
}
.lg-shadow{position:absolute;left:0;top:0;color:#3A5568}
.lg-word{color:#8FA2B2;letter-spacing:.3em;font-size:.95em}
.lg-cur{color:var(--ice);visibility:hidden}
.logo.live .lg-block{animation:shimmer 4.5s ease-in-out infinite}
.logo.live .lg-cur{visibility:visible;animation:blink 1.06s steps(1) infinite}
@keyframes shimmer{0%{background-position:150% 0}55%,100%{background-position:-50% 0}}
.info{min-width:min(100%,38ch);flex:1}
.info .k{color:var(--ice);font-weight:650}
.info .sep{color:var(--dim)}
.sw{display:inline-block;width:2.6ch;height:1.05em;vertical-align:-.18em}
.swrow{margin-top:.45rem;line-height:1}

/* Help */
.grp{color:var(--snow);font-weight:600;margin-top:.5rem}
.help{display:grid;grid-template-columns:max-content 1fr;gap:0 3ch;padding-left:2ch;margin-bottom:.2rem}
.help .hc{color:var(--ice)}
@media (max-width:520px){ .help{grid-template-columns:1fr;padding-left:1ch} .help .hd{color:var(--dim);margin-bottom:.35rem} }

/* Man page */
.man{max-width:80ch;margin:.2rem 0 .6rem}
.man .mh{display:flex;justify-content:space-between;gap:1ch;color:var(--dim)}
.man h3{font-size:1em;margin:1em 0 .15em;color:var(--snow);font-weight:650;letter-spacing:.02em}
.man p{margin:0 0 .35em;padding-left:7ch}
.man dl{margin:0;padding-left:7ch}
.man dt{color:var(--ice)} .man dd{margin:0 0 .35em 4ch}
@media (max-width:520px){ .man p,.man dl{padding-left:2ch} .man dd{margin-left:2ch} }

/* Train */
.trainwrap{position:relative;overflow:hidden;height:7.2em}
.train{position:absolute;left:0;top:0;white-space:pre;color:var(--amber);will-change:transform;line-height:1.2}

/* Bottom: translucent dock over scrolling content, then a tmux-style status line */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg-2)}
#dock{
  display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;
  padding:.6rem clamp(.85rem,3vw,2rem);
  background:rgba(15,26,36,.72);
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-top:1px solid rgba(255,255,255,.06);
  mask-image:linear-gradient(90deg,#000 calc(100% - 2.5rem),transparent);
}
#bottom{background:transparent}
#dock::-webkit-scrollbar{display:none}
.chip{
  flex:none;font:inherit;font-variation-settings:inherit;font-weight:500;color:var(--fg);
  background:rgba(124,196,240,.07);border:1px solid rgba(124,196,240,.22);border-radius:7px;
  padding:.4rem .78rem;cursor:pointer;
  transition:transform 100ms ease-out,background-color 120ms ease-out,border-color 120ms ease-out;
}
.chip:hover{border-color:rgba(124,196,240,.5);color:var(--snow)}
.chip:active{transform:scale(.97);background:rgba(124,196,240,.17)}
#status{
  display:flex;justify-content:space-between;gap:1rem;white-space:nowrap;
  padding:.22rem clamp(.85rem,3vw,2rem);background:var(--bg-2);color:var(--dim);font-size:.86em;
}
#status .win{color:var(--bg);background:var(--ice);padding:0 .7ch;font-weight:600;margin-right:1ch}
#statusMid{overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){ #statusMid{display:none} }

/* htop overlay */
#overlay{
  position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + .9rem) clamp(.85rem,3vw,2rem) env(safe-area-inset-bottom,0px);
}
#ovBody{flex:1;overflow:auto;scrollbar-width:thin}
.ovnote{margin:0 0 .6rem}
.htop-top{display:flex;flex-wrap:wrap;gap:.4rem 4ch;margin-bottom:.8rem}
.htop-top .hl{color:var(--ice)}
.bar{color:var(--pine)} .bar.mem{color:var(--ice)} .bar.gpu{color:var(--violet)}
.thead{background:var(--pine);color:var(--bg);font-weight:600;display:inline-block;min-width:100%}
.tbl{overflow-x:auto}
.tbl pre{min-width:max-content}
.pcmd{color:var(--snow)}
#ovKeys{display:flex;flex-wrap:wrap;gap:0;padding:.5rem 0 .6rem;white-space:nowrap}
.fk{color:var(--fg);padding:0 .2ch 0 .8ch}
.fl{background:var(--ice);color:var(--bg);padding:0 1.2ch 0 .4ch;font-weight:600}
#ovQuit{font:inherit;font-variation-settings:inherit;border:0;padding:0;background:none;cursor:pointer;display:inline-flex;transition:transform 100ms ease-out}
#ovQuit:active{transform:scale(.97)}

/* Matrix rain */
canvas.matrix{position:fixed;inset:0;width:100%;height:100%;z-index:40;background:var(--bg);cursor:pointer;transition:opacity 300ms ease-out}

/* Konami aurora: revontulet */
body.aurora::after{
  content:"";position:fixed;inset:-20%;z-index:5;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(40% 30% at 30% 25%,rgba(125,186,148,.55),transparent 70%),
    radial-gradient(35% 25% at 60% 20%,rgba(111,199,194,.45),transparent 70%),
    radial-gradient(30% 22% at 78% 30%,rgba(179,157,219,.40),transparent 70%);
  animation:aurora 7s ease-in-out forwards;
}
@keyframes aurora{
  0%{opacity:0;transform:translateX(-6%) skewY(-4deg)}
  25%{opacity:.75}
  75%{opacity:.6;transform:translateX(6%) skewY(3deg)}
  100%{opacity:0;transform:translateX(8%) skewY(4deg)}
}

#cmdLine{display:flex;align-items:baseline;white-space:pre}
#cmd{
  flex:1;min-width:0;padding:0;margin:0;border:0;outline:0;background:transparent;
  color:var(--snow);font:inherit;font-variation-settings:inherit;
  caret-color:var(--ice);caret-shape:block;
}
@media (pointer:coarse){ #cmd{font-size:16px} }

@media (prefers-reduced-motion: reduce){
  .cur{animation:none}
  .logo.live .lg-block,.logo.live .lg-cur{animation:none}
  .chip,.chip:active,#ovQuit:active{transform:none}
  body.aurora::after{animation:auroraFade 3s ease-in-out forwards}
  @keyframes auroraFade{0%{opacity:0}30%{opacity:.6}100%{opacity:0}}
}
@media (prefers-reduced-transparency: reduce){
  #dock{background:var(--bg-2);-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<nav class="sr-only" aria-label="Pages">
  <a href="/projects">Projects</a>
  <a href="/paper">Daily AI newspaper</a>
  <a href="/keymap">Sofle keymap</a>
  <a href="/writing">Writing</a>
</nav>
<noscript>
  <p>Jaakko. AI specialist and consultant, Helsinki.</p>
  <p><a href="/projects">Projects</a> <a href="/paper">Paper</a> <a href="/keymap">Keymap</a> <a href="/writing">Writing</a></p>
</noscript>

<div id="app">
  <main id="term" aria-label="Terminal">
    <div id="screen">
      <div id="out" role="log" aria-live="off"></div>
      <div id="cmdLine" hidden>
        <span id="prompt"></span><input id="cmd" type="text" aria-label="Command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
      </div>
    </div>
  </main>

  <div id="bottom">
    <nav id="dock" aria-label="Quick commands">
      <button class="chip" data-cmd="open projects">projects</button>
      <button class="chip" data-cmd="open paper">paper</button>
      <button class="chip" data-cmd="open keymap">keymap</button>
      <button class="chip" data-cmd="open writing">writing</button>
      <button class="chip" data-cmd="man jaakko">manual</button>
      <button class="chip" data-cmd="contact">contact</button>
      <button class="chip" data-cmd="help">help</button>
    </nav>
    <div id="status">
      <span><span class="win">0:jsh*</span>[jaalip]</span>
      <span id="statusMid"></span>
      <span id="clock"></span>
    </div>
  </div>
</div>

<div id="overlay" role="dialog" aria-label="htop process viewer" hidden>
  <div id="ovBody"></div>
  <div id="ovKeys" aria-hidden="false">
    <span class="fk">F1</span><span class="fl">Help</span>
    <span class="fk">F3</span><span class="fl">Search</span>
    <span class="fk">F6</span><span class="fl">SortBy</span>
    <span class="fk">F9</span><span class="fl">Kill</span>
    <button id="ovQuit" aria-label="Quit htop"><span class="fk">F10</span><span class="fl">Quit</span></button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   CONFIG: edit this block. Everything else reads from it.
   demo: true  -> page links print a message instead of navigating.
   demo: false -> "open" navigates to the route (use this in Astro).
   ================================================================ */
const CONFIG = {
  demo: true,
  user: 'guest',
  host: 'kiroshi',
  domain: 'jaalip.com',
  owner: 'Jaakko',
  role: 'AI specialist and consultant',
  focus: 'Self-hosted, GDPR-compliant LLM platforms for EU enterprises',
  stack: 'Kafka, Azure, Python, Proxmox, vLLM, observability',
  location: 'Helsinki, FI (from Turku)',
  langs: 'fi, en',
  routes: {
    projects: '/projects',
    paper: '/paper',
    keymap: '/keymap',
    writing: '/writing',
    thesis: '/projects/llm-eval-service',
  },
  contact: {
    email: '[TODO]@jaalip.com',
    github: 'https://github.com/[TODO]',
    linkedin: 'https://www.linkedin.com/in/[TODO]',
  },
  log: [
    { hash: 'a1f3c9e', ref: 'HEAD -> main', type: 'paper',    msg: 'daily AI newspaper goes live',                       cmd: 'open paper',    when: '[TODO date]' },
    { hash: '7b2e410',                      type: 'keymap',   msg: 'Sofle layout quick reference',                       cmd: 'open keymap',   when: '[TODO date]' },
    { hash: 'c94d1aa',                      type: 'projects', msg: 'side projects page',                                 cmd: 'open projects', when: '[TODO date]' },
    { hash: '3e8f702',                      type: 'thesis',   msg: 'Kafka-native LLM evaluation service (LUT x Telia)',  cmd: 'open thesis',   when: 'spring 2026' },
    { hash: '0d5b9c1',                      type: 'homelab',  msg: 'two-node Proxmox cluster with RTX 3090 passthrough', cmd: 'cat ~/projects/homelab.md', when: '[TODO date]' },
  ],
};

/* Virtual filesystem under /home/guest */
const FS = { type: 'dir', children: {
  'projects': { type: 'dir', route: 'projects', children: {
    'llm-eval-service.md': { type: 'file', route: 'thesis', body:
`# LLM evaluation service
Kafka-native microservice that scores LLM and RAG output as events flow through the pipeline.
Built for my LUT master's thesis, together with Telia Finland.
[TODO: link to repo or write-up]` },
    'homelab.md': { type: 'file', body:
`# Homelab
Two-node Proxmox cluster with RTX 3090 GPU passthrough.
Runs vLLM, Open WebUI, LiteLLM, Langfuse, SearXNG and n8n.
Public traffic goes through a VPS with Pangolin. Private access uses Tailscale.
[TODO: architecture diagram]` },
    'agent-guidelines.md': { type: 'file', body:
`# Agent development guidelines
A guideline framework for building AI agents.
Markdown content, plus CI that uses an LLM to generate skills.
Status: planned.` },
  }},
  'paper': { type: 'dir', route: 'paper', children: {
    'today.html': { type: 'file', route: 'paper', body: 'A daily HTML newspaper, written by a local LLM pipeline.' },
  }},
  'keymap': { type: 'dir', route: 'keymap', children: {
    'sofle.md': { type: 'file', route: 'keymap', body: 'Quick reference for the layers on my Sofle split keyboard.' },
  }},
  'writing': { type: 'dir', route: 'writing', children: {
    'README.md': { type: 'file', body: '[TODO: first posts]' },
  }},
  'contact.txt': { type: 'file', special: 'contact' },
  'README.md': { type: 'file', body:
`Welcome to ${CONFIG.domain}.
This is a terminal, but you do not need to know Linux.
Click anything underlined, or use the buttons at the bottom.
Type help to see all commands.` },
  '.secrets': { type: 'file', hidden: true, body:
`API_KEY=****************

# Real secrets live in a vault, not in a static site.
# Nice try though.` },
}};

/* ---------------------------------------------------------------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
const T0 = Date.now();
const $ = s => document.querySelector(s);
const out = $('#out'), term = $('#term'), cmdLine = $('#cmdLine'), input = $('#cmd'),
      promptEl = $('#prompt'), statusMid = $('#statusMid'), clock = $('#clock'),
      ov = $('#overlay'), ovBody = $('#ovBody'), ovQuit = $('#ovQuit');

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = (a, b) => a + Math.random() * (b - a);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage off: fine */ } },
};

let introRunning = false, skip = false, cancel = false, cancelReason = '', busy = true;
let anyKeyCancels = false, overlayOpen = false, mode = 'sh', queued = null;
let closeOverlay = () => {};
const hist = []; let hIdx = 0;
let cwd = [];

/* Interruptible sleep: skip or cancel resolves every pending wait at once */
const pending = new Set();
const fast = () => skip || cancel || RM;
function sleep(ms) {
  if (fast()) return Promise.resolve();
  return new Promise(r => {
    const done = () => { clearTimeout(t); pending.delete(done); r(); };
    const t = setTimeout(done, ms);
    pending.add(done);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function flush() { [...pending].forEach(d => d()); }

/* Output */
let stick = true;
term.addEventListener('scroll', () => { stick = term.scrollHeight - term.scrollTop - term.clientHeight < 48; }, { passive: true });
function scroll(force) { if (stick || force) term.scrollTop = term.scrollHeight; }
function print(html = '', cls = '') {
  const d = document.createElement('div');
  d.className = 'ln' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  out.appendChild(d);
  scroll();
  return d;
}
const printText = (t, cls) => print(esc(t), cls);
const link = (html, cmd, href = '#') => `<a class="lnk" href="${esc(href)}" data-cmd="${esc(cmd)}">${html}</a>`;

const dirName = () => cwd.length ? cwd[cwd.length - 1] : '~';
const fullCwd = () => '~' + (cwd.length ? '/' + cwd.join('/') : '');
function promptHTML() {
  if (mode === 'vim') return '<span class="pv">:</span>';
  return `<span class="pb">[</span><span class="pu">${CONFIG.user}</span><span class="pb">@</span><span class="ph">${CONFIG.host}</span> <span class="pd">${esc(dirName())}</span><span class="pb">]$</span> `;
}
function updateStatus() { statusMid.textContent = `${CONFIG.user}@${CONFIG.host}:${fullCwd()}`; }
function showInput() {
  cmdLine.hidden = false;
  promptEl.innerHTML = promptHTML();
  updateStatus();
  scroll(true);
  if (!TOUCH) input.focus({ preventScroll: true });
}

async function typeInto(el, text, { min = 40, max = 110 } = {}) {
  for (let i = 0; i < text.length; i++) {
    if (fast()) { el.textContent = text; return; }
    el.textContent += text[i];
    scroll();
    await sleep(rand(min, max));
  }
}
async function typeCmd(cmd) {
  const d = print(promptHTML() + '<span class="typed echo"></span><span class="cur" aria-hidden="true"></span>');
  await sleep(420);
  await typeInto(d.querySelector('.typed'), cmd);
  await sleep(260);
  d.querySelector('.cur')?.remove();
}

/* ---------------- Content builders ---------------- */
/* JL logo, option C (shadow block). Block and shadow layers are split so the gradient only hits the blocks. */
const LOGO_BLOCK = [
  '     ██  ██',
  '     ██  ██',
  '     ██  ██',
  '██   ██  ██',
  ' █████   ███████',
  ' ',
].join('\n');
const LOGO_SHADOW = [
  '       ╗   ╗',
  '       ║   ║',
  '       ║   ║',
  '       ║   ║',
  '╚     ╔╝        ╗',
  ' ╚════╝  ╚══════╝',
].join('\n');
function logoHTML() {
  return `<div class="logo live" aria-hidden="true">
    <div class="logo-mark"><pre class="lg-block">${LOGO_BLOCK}</pre><pre class="lg-shadow">${LOGO_SHADOW}</pre></div>
    <div class="lg-word">${esc(CONFIG.domain.split('.')[0])}<span class="lg-cur">▌</span></div>
  </div>`;
}
function uptimeShort() {
  const m = Math.floor((Date.now() - T0) / 60000);
  return m < 1 ? 'just now (your visit)' : `${m} min${m === 1 ? '' : 's'} (your visit)`;
}
function fetchHTML() {
  out.querySelectorAll('.logo.live').forEach(el => el.classList.remove('live'));
  const rows = [
    ['OS', `${CONFIG.domain} (Arch flavoured)`],
    ['Host', `${CONFIG.host} (Proxmox node)`],
    ['Kernel', '6.11.2-arch1-1'],
    ['Uptime', uptimeShort()],
    ['Shell', 'jsh 1.0'],
    ['Owner', CONFIG.owner],
    ['Role', CONFIG.role],
    ['Focus', CONFIG.focus],
    ['Stack', CONFIG.stack],
    ['Location', CONFIG.location],
    ['Langs', CONFIG.langs],
  ];
  const c1 = ['#1C2B38', '#E27878', '#7DBA94', '#E5B567', '#7CC4F0', '#B39DDB', '#6FC7C2', '#CFD9E2'];
  const c2 = ['#3A4F61', '#F0A0A0', '#A6D6B5', '#F2D095', '#ABDAF7', '#D2C3EC', '#A3E0DC', '#F2F5F7'];
  const sw = arr => arr.map(c => `<span class="sw" style="background:${c}"></span>`).join('');
  return `<div class="fetch">

function resolve(p) {
  let base;
  if (!p || p === '.') return { node: nodeAt(cwd), path: [...cwd] };
  if (p === '~' || p.startsWith('~/')) { base = []; p = p.slice(1); }
  else if (p.startsWith('/home/guest')) { base = []; p = p.slice(11); }
  else if (p.startsWith('/')) return null;
  else base = [...cwd];
  for (const seg of p.split('/').filter(Boolean)) {
    if (seg === '.') continue;
    if (seg === '..') { base.pop(); continue; }
    base.push(seg);
  }
  const node = nodeAt(base);
  return node ? { node, path: base } : null;
}
function nodeAt(path) {
  let n = FS;
  for (const s of path) {
    if (n.type !== 'dir' || !n.children[s]) return null;
    n = n.children[s];
  }
  return n;
}

function printLs(node, path, all = false, long = false) {
  const names = Object.keys(node.children)
    .filter(n => all || !node.children[n].hidden)
    .sort((a, b) => a.replace(/^\./, '').localeCompare(b.replace(/^\./, '')));
  const item = n => {
    const ch = node.children[n];
    const full = '~/' + [...path, n].join('/');
    if (ch.type === 'dir') {
      const cmd = ch.route ? `open ${ch.route}` : `ls ${full}`;
      return link(`<span class="dir">${esc(n)}/</span>`, cmd, ch.route ? CONFIG.routes[ch.route] : '#');
    }
    return link(`<span class="${n.startsWith('.') ? 'hid' : 'file'}">${esc(n)}</span>`, `cat ${full}`);
  };
  if (long) {
    print(`total ${names.length * 4}`);
    names.forEach(n => {
      const ch = node.children[n];
      const perm = ch.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--';
      const size = ch.type === 'dir' ? 4096 : (ch.body ? ch.body.length : 312);
      print(`<span class="dim">${perm} guest guest ${String(size).padStart(5)} Oct  7 09:41</span> ${item(n)}`);
    });
  } else {
    print(names.map(item).join('  '));
  }
}

async function matrix() {
  if (RM) { printText('Reduced motion is on, so the rain stays off.', 'dim'); return; }
  const c = document.createElement('canvas');
  c.className = 'matrix'; c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const fs = 16, cols = Math.ceil(w / fs);
  const drops = Array.from({ length: cols }, () => rand(-40, 0));
  const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ÄÖÅäöå<>/{}#$';
  anyKeyCancels = true;
  c.addEventListener('pointerdown', () => { cancel = true; });
  const end = performance.now() + 7000;
  await new Promise(res => {
    let last = 0;
    const f = t => {
      if (t - last > 50) {
        last = t;
        ctx.fillStyle = 'rgba(15,26,36,.2)'; ctx.fillRect(0, 0, w, h);
        ctx.font = `${fs}px "Martian Mono", ui-monospace, monospace`;
        for (let i = 0; i < cols; i++) {
          const y = drops[i] * fs;
          ctx.fillStyle = Math.random() < .05 ? '#F2F5F7' : (i % 7 === 0 ? '#7CC4F0' : '#7DBA94');
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, y);
          if (y > h && Math.random() > .975) drops[i] = 0;
          drops[i]++;
        }
      }
      if (t < end && !cancel) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
  c.style.opacity = '0';
  await wait(300);
  c.remove();
  print('<span class="dim">Back to the terminal. The rain had ä and ö in it.</span>');
}

  printText(`${times.length} packets transmitted, ${times.length} received, 0% packet loss`);
  if (times.length) {

    printText(`rtt min/avg/max = ${Math.min(...times).toFixed(3)}/${avg.toFixed(3)}/${Math.max(...times).toFixed(3)} ms`);
  }
}

function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function notFound(cmd) {
  printText(`jsh: ${cmd}: command not found`, 'err');
  const best = VISIBLE.map(c => [c, levenshtein(cmd.toLowerCase(), c)]).sort((x, y) => x[1] - y[1])[0];
  if (best && best[1] <= 2) print(`<span class="dim">Did you mean </span>${link(best[0], best[0])}<span class="dim">?</span>`);
}

function vimInput(line) {
  const t = line.trim();
  const c = t.startsWith(':') ? t : ':' + t;
  if ([':q', ':q!', ':wq', ':wq!', ':x', ':qa', ':qa!'].includes(c) || t === 'ZZ') {
    mode = 'sh';
    printText('You escaped vim. Few do.');
    return;
  }
  if (c === ':help') { printText('Type :q to quit. That is the whole tutorial.'); return; }
  printText(`E492: Not an editor command: ${c.slice(1)}`, 'err');
}

async function dispatch(line) {
  if (mode === 'vim') return vimInput(line);
  const l = line.toLowerCase().replace(/\s+/g, ' ').trim();
  const SPECIAL = {
    'sudo rm -rf /': fakeWipe,
    'sudo rm -rf / --no-preserve-root': fakeWipe,
    'sudo rm -rf --no-preserve-root /': fakeWipe,
    'rm -rf / --no-preserve-root': fakeWipe,
    'rm -rf --no-preserve-root /': fakeWipe,
    'rm -rf /': () => { printText("rm: it is dangerous to operate recursively on '/'", 'err'); printText('rm: use --no-preserve-root to override this failsafe', 'err'); },
    'sudo make me a sandwich': () => printText('Okay.'),
    'make me a sandwich': () => printText('What? Make it yourself.'),
    'i use arch btw': () => C.btw(),
    'sudo pacman -syu': pacmanUpgrade,
  };
  if (SPECIAL[l]) return SPECIAL[l]();
  const tokens = line.trim().split(/\s+/);
  const cmd = tokens[0], args = tokens.slice(1);
  const fn = Object.prototype.hasOwnProperty.call(C, cmd) ? C[cmd] : (Object.prototype.hasOwnProperty.call(C, cmd.toLowerCase()) ? C[cmd.toLowerCase()] : null);
  if (fn) return fn(args, line);
  notFound(cmd);
}

/* ---------------- Completion ---------------- */
function commonPrefix(arr) {
  if (!arr.length) return '';
  let p = arr[0];
  for (const s of arr) while (!s.startsWith(p)) p = p.slice(0, -1);
  return p;
}
function complete() {
  const v = input.value;
  const parts = v.split(' ');
  let cands, last = parts[parts.length - 1], replaceWith;
  if (parts.length === 1) {
    cands = VISIBLE.filter(c => c.startsWith(last));
    replaceWith = c => c + ' ';
  } else {
    const slash = last.lastIndexOf('/');
    const dirPart = slash >= 0 ? last.slice(0, slash + 1) : '';
    const pre = last.slice(slash + 1);
    const r = resolve(dirPart || '.');
    if (!r || r.node.type !== 'dir') return;
    cands = Object.keys(r.node.children)
      .filter(n => n.startsWith(pre) && (pre.startsWith('.') || !r.node.children[n].hidden))
      .map(n => n + (r.node.children[n].type === 'dir' ? '/' : ''));
    replaceWith = c => dirPart + c + (c.endsWith('/') ? '' : ' ');
    last = pre;
  }
  if (!cands.length) return;
  const head = parts.slice(0, -1).join(' ') + (parts.length > 1 ? ' ' : '');
  if (cands.length === 1) { input.value = head + replaceWith(cands[0]); return; }
  const cp = commonPrefix(cands);
  if (cp.length > last.length) {
    const dp = parts.length > 1 ? parts[parts.length - 1].slice(0, parts[parts.length - 1].lastIndexOf('/') + 1) : '';
    input.value = head + dp + cp;
    return;
  }
  print(promptHTML() + `<span class="echo">${esc(v)}</span>`);
  printText(cands.join('  '));
  scroll(true);
}

/* ---------------- Input wiring ---------------- */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); execute(input.value); }
  else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (hist.length) { hIdx = Math.max(0, hIdx - 1); input.value = hist[hIdx] || ''; }
  }
  else if (e.key === 'ArrowDown') {
    e.preventDefault();
    hIdx = Math.min(hist.length, hIdx + 1); input.value = hist[hIdx] || '';
  }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; }
  else if (e.ctrlKey && e.key.toLowerCase() === 'c' && !String(getSelection())) {
    e.preventDefault();
    print(promptHTML() + `<span class="echo">${esc(input.value)}</span><span class="dim">^C</span>`);
    input.value = '';
    scroll(true);
  }
});

  }
}

document.addEventListener('keydown', e => {
  konami(e.key);
  if (introRunning) {
    if (!['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) skipIntro();
    return;
  }
  if (overlayOpen && ['q', 'Q', 'Escape', 'F10'].includes(e.key)) { e.preventDefault(); closeOverlay(); return; }
  if (busy && (e.key === 'Escape' || (e.ctrlKey && e.key.toLowerCase() === 'c'))) { e.preventDefault(); cancelRun('ctrlc'); return; }
  if (busy && anyKeyCancels) { cancelRun('soft'); return; }
  if (!busy && document.activeElement !== input && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) input.focus({ preventScroll: true });
});

/* Tap or click on the terminal focuses the prompt, but not after a scroll or a text selection */
let down = null;
term.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY };
  if (introRunning && !e.target.closest('a')) skipIntro();
});
term.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10;
  down = null;
  if (moved || busy || e.target.closest('a,button') || String(getSelection())) return;
  input.focus({ preventScroll: true });
});
out.addEventListener('click', e => {
  const a = e.target.closest('a[data-cmd]');
  if (!a) return;
  e.preventDefault();
  submitTyped(a.dataset.cmd);
});
$('#dock').addEventListener('click', e => {
  const b = e.target.closest('button[data-cmd]');
  if (b) submitTyped(b.dataset.cmd);
});

/* Status line clock, Helsinki time */
function tick() {
  const now = new Date();
  const t = now.toLocaleTimeString('en-GB', { timeZone: 'Europe/Helsinki', hour: '2-digit', minute: '2-digit' });
  const d = now.toLocaleDateString('en-GB', { timeZone: 'Europe/Helsinki', weekday: 'short', day: '2-digit', month: 'short' });
  clock.textContent = `${t}  ${d}`;
}
tick();
setInterval(tick, 15000);

/* Returning visitors skip the boot log but still get the fetch card */
intro({ boot: !store.get('jaalip.lastLogin'), auto: true });
})();
</script>
