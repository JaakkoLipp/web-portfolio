name: Deploy Astro to VPS

on:
  push:
    branches: [ "main" ]

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload dist to new release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE_ID="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

          rsync -az --delete -e "ssh -p ${VPS_PORT}" \
            ./dist/ "${VPS_USER}@${VPS_HOST}:/var/www/portfolio/releases/${RELEASE_ID}/"

      - name: Atomic switch + cleanup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
        run: |
          ssh -p ${VPS_PORT} ${VPS_USER}@${VPS_HOST} bash -lc "set -euo pipefail
            ln -sfn /var/www/portfolio/releases/${RELEASE_ID} /var/www/portfolio/current
            ls -1dt /var/www/portfolio/releases/* | tail -n +6 | xargs -r rm -rf
          "
