name: Deploy to netwatch

on:
  push:
    branches: [ "main" ]
  # Run it by hand from the Actions tab to test the pipeline without a new commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public URL that must serve the new release. Override with a repository variable.
  SITE_URL: ${{ vars.SITE_URL || 'https://jaalip.com' }}

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A manual run from another branch must never reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check and size budget
        run: npm run check

      - name: Stamp the release
        run: echo "${GITHUB_SHA}" > dist/version.txt

      # The deploy key is locked to one job on the server: it can upload a
      # release and activate it, nothing else. The host key is pinned.
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            Port ${VPS_PORT}
            User ${VPS_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 2m
          EOF

      - name: Upload a new release
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_ID=${RELEASE_ID}" >> "${GITHUB_ENV}"
          rsync -rlptz --chmod=D755,F644 ./dist/ "vps:${RELEASE_ID}/"

      - name: Switch the site to the new release
        run: ssh vps activate "${RELEASE_ID}"

      - name: Verify the live site serves this release
        run: |
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsS --max-time 10 "${SITE_URL}/version.txt?t=$(date +%s)" || true)"
            if [ "${live}" = "${GITHUB_SHA}" ]; then echo "Live: ${live}"; exit 0; fi
            echo "Attempt ${i}: live version is '${live:-unreachable}', want ${GITHUB_SHA}"
            sleep 10
          done
          # Print the reason (for example a TLS error) before failing.
          curl -sS -o /dev/null --max-time 10 "${SITE_URL}/version.txt" || true
          echo "::error::${SITE_URL} does not serve this release. The upload and switch worked, so check the web server and routing on the VPS. See docs/deploy.md."
          exit 1
